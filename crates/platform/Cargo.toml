[package]
name = "filmcraft-platform"
description = "OS media integration: hardware video decoding (VideoToolbox, Media Foundation) and encoding (Media Foundation) through the operating system's codecs, with transparent fallback to the pure-Rust codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The one crate allowed to contain `unsafe` (OS media FFI; AGENTS.md §0.3, docs/adr/0001-platform-ffi.md).
# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: only the FFI modules
# opt in with `#[allow(unsafe_code)]`, and every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
filmcraft-codecs = { workspace = true }
filmcraft-isobmff = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
filmcraft-color = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-time = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-time = { workspace = true }
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-h264enc = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
