[package]
name = "filmcraft-flac"
description = "Clean-room FLAC encoder (RFC 9639)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
# a second, independent decoder (the one FilmCraft imports FLAC with) for bit-exact round trips
symphonia = { version = "0.5.5", default-features = false, features = ["flac"] }
